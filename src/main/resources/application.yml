spring:
  application:
    name: Academic

  datasource:
    url: jdbc:postgresql://localhost:5432/academic
    username: ujs
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
