spring:
  application:
    name: Academic

  datasource:
    url: jdbc:postgresql://localhost:5432/academic
    username: ujs
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경변수로 덮어써야 한다 (HS256 최소 256bit 권장).
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-please-override-in-prod-32bytes+}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
